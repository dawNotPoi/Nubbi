name: Preview Deploy

on:
  push:
    branches:
      - preview
  workflow_dispatch:

concurrency:
  group: nubbi-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Build and Deploy Preview
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.PREVIEW_DEPLOY_HOST || secrets.DEPLOY_HOST || 'dawnpoi.site' }}
      DEPLOY_USER: ${{ vars.PREVIEW_DEPLOY_USER || secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.PREVIEW_DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD || '' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || '' }}
      PREVIEW_WEB_PORT: ${{ vars.PREVIEW_WEB_PORT || '8088' }}
      PREVIEW_API_PORT: ${{ vars.PREVIEW_API_PORT || vars.SERVER_PORT || secrets.SERVER_PORT || '4000' }}
      PREVIEW_SOCKET_PORT: ${{ vars.PREVIEW_SOCKET_PORT || vars.SOCKET_PORT || secrets.SOCKET_PORT || '4040' }}
      PREVIEW_TRUSTED_ORIGIN: ${{ vars.PREVIEW_TRUSTED_ORIGIN || vars.CLIENT_URL || secrets.CLIENT_URL || '' }}
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint client
        run: pnpm --filter nubbi-client lint

      - name: Build client for same-origin preview
        env:
          VITE_API_URL: ""
          VITE_AUTH_URL: ""
          VITE_SOCKET_URL: ""
        run: pnpm --filter nubbi-client build

      - name: Deploy isolated preview
        run: bash .github/scripts/deploy-preview-client.sh

      - name: Preview URL
        run: |
          echo "Preview: http://${DEPLOY_HOST}:${PREVIEW_WEB_PORT}"
          echo "Same-origin API proxy -> host:${PREVIEW_API_PORT}"
          echo "Same-origin Socket.IO proxy -> host:${PREVIEW_SOCKET_PORT}"
          echo "Server path: ~/nubbi-preview"
          echo "Container: nubbi-preview"
