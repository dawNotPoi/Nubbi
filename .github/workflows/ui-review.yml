name: UI Review Build
on:
  push:
    branches: [ui/brand-auth-20260917]
permissions:
  contents: read
concurrency:
  group: nubbi-ui-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Collect review source
        run: |
          git archive --format=tar.gz -o ui-source.tar.gz HEAD client AGENTS.md .agent docs/ui docs/auth docs/changes package.json pnpm-lock.yaml pnpm-workspace.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-source
          path: ui-source.tar.gz
          retention-days: 3
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter nubbi-client lint
      - name: Build review bundle
        env:
          VITE_API_URL: ""
          VITE_AUTH_URL: ""
          VITE_SOCKET_URL: ""
        run: pnpm --filter nubbi-client build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-dist
          path: client/dist
          retention-days: 3
          if-no-files-found: error
