name: Deploy

on:
  push:
    branches:
      - deploy
  pull_request:
    branches:
      - master
      - develop
      - release/**
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: deploy

concurrency:
  group: deploy-${{ github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Service Changes
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.detect.outputs.client }}
      server: ${{ steps.detect.outputs.server }}
      mcp: ${{ steps.detect.outputs.mcp }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Detect changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: bash .github/scripts/detect-service-changes.sh

  verify-client:
    name: Verify Client
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.client == 'true'
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || '' }}
      VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || secrets.VITE_AUTH_URL || '' }}
      VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || secrets.VITE_SOCKET_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint client
        run: pnpm --filter nubbi-client lint

      - name: Build client
        run: pnpm --filter nubbi-client build

      - name: Upload client dist
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  verify-server:
    name: Verify Server
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm --filter nubbi-server typecheck

      - name: Build server image
        run: docker build -f server/Dockerfile -t nubbi-server:verify .

  verify-mcp:
    name: Verify MCP
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test MCP server
        run: pnpm --filter nubbi-mcp-server test

      - name: Build MCP image
        run: docker build -f mcp/Dockerfile -t nubbi-mcp-server:verify .

  deploy-client:
    name: Deploy Client
    runs-on: ubuntu-latest
    needs:
      - changes
      - verify-client
      - verify-server
      - verify-mcp
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.changes.outputs.client == 'true' &&
      needs.verify-client.result == 'success' &&
      (needs.verify-server.result == 'success' || needs.verify-server.result == 'skipped') &&
      (needs.verify-mcp.result == 'success' || needs.verify-mcp.result == 'skipped')
    environment: production
    env:
      DEPLOY_SERVICE: client
      DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD || '' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || '' }}
      VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || '' }}
      VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || secrets.VITE_AUTH_URL || '' }}
      VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || secrets.VITE_SOCKET_URL || '' }}
      WEB_PORT: ${{ vars.WEB_PORT || secrets.WEB_PORT || '' }}
      MONGO_URI: ${{ secrets.MONGO_URI || '' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || '' }}
      SOCKET_PORT: ${{ vars.SOCKET_PORT || secrets.SOCKET_PORT || '' }}
      MCP_PORT: ${{ vars.MCP_PORT || secrets.MCP_PORT || '' }}
      MCP_BIND_ADDRESS: ${{ vars.MCP_BIND_ADDRESS || secrets.MCP_BIND_ADDRESS || '' }}
      MCP_ALLOWED_HOSTS: ${{ vars.MCP_ALLOWED_HOSTS || secrets.MCP_ALLOWED_HOSTS || '' }}
      MCP_ALLOWED_ORIGINS: ${{ vars.MCP_ALLOWED_ORIGINS || secrets.MCP_ALLOWED_ORIGINS || '' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || '' }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || secrets.BETTER_AUTH_URL || '' }}
      CLIENT_URL: ${{ vars.CLIENT_URL || secrets.CLIENT_URL || '' }}
      AUTH_GITHUB_ID: ${{ vars.AUTH_GITHUB_ID || secrets.AUTH_GITHUB_ID || '' }}
      AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET || '' }}
      AUTH_GOOGLE_ID: ${{ vars.AUTH_GOOGLE_ID || secrets.AUTH_GOOGLE_ID || vars.AUTH_GOOLE_ID || secrets.AUTH_GOOLE_ID || '' }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET || secrets.AUTH_GOOLE_SECRET || '' }}
      AUTH_GOOLE_ID: ${{ vars.AUTH_GOOLE_ID || secrets.AUTH_GOOLE_ID || '' }}
      AUTH_GOOLE_SECRET: ${{ secrets.AUTH_GOOLE_SECRET || '' }}
      EMAIL_USER: ${{ secrets.EMAIL_USER || '' }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS || '' }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM || '' }}
      EMAIL_SERVICE: ${{ vars.EMAIL_SERVICE || secrets.EMAIL_SERVICE || '' }}
      AI_CONFIG_SECRET: ${{ secrets.AI_CONFIG_SECRET || '' }}
      GH_IMAGE_REPO: ${{ vars.GH_IMAGE_REPO || secrets.GH_IMAGE_REPO || '' }}
      GH_IMAGE_TOKEN: ${{ secrets.GH_IMAGE_TOKEN || '' }}
      GH_IMAGE_BRANCH: ${{ vars.GH_IMAGE_BRANCH || secrets.GH_IMAGE_BRANCH || 'main' }}
      WEB_SEARCH_PROVIDER: ${{ vars.WEB_SEARCH_PROVIDER || secrets.WEB_SEARCH_PROVIDER || '' }}
      WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY || '' }}
      WEB_SEARCH_BASE_URL: ${{ vars.WEB_SEARCH_BASE_URL || secrets.WEB_SEARCH_BASE_URL || '' }}
      SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST || '' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT || '' }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE || secrets.SMTP_SECURE || '' }}
      DEPLOY_SYNC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Download client dist
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Deploy client
        run: bash .github/scripts/deploy-service.sh

  deploy-server:
    name: Deploy Server
    runs-on: ubuntu-latest
    needs:
      - changes
      - verify-client
      - verify-server
      - verify-mcp
      - deploy-client
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.changes.outputs.server == 'true' &&
      needs.verify-server.result == 'success' &&
      (needs.verify-client.result == 'success' || needs.verify-client.result == 'skipped') &&
      (needs.verify-mcp.result == 'success' || needs.verify-mcp.result == 'skipped') &&
      (needs.deploy-client.result == 'success' || needs.deploy-client.result == 'skipped')
    environment: production
    env:
      DEPLOY_SERVICE: server
      DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD || '' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || '' }}
      VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || '' }}
      VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || secrets.VITE_AUTH_URL || '' }}
      VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || secrets.VITE_SOCKET_URL || '' }}
      WEB_PORT: ${{ vars.WEB_PORT || secrets.WEB_PORT || '' }}
      MONGO_URI: ${{ secrets.MONGO_URI || '' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || '' }}
      SOCKET_PORT: ${{ vars.SOCKET_PORT || secrets.SOCKET_PORT || '' }}
      MCP_PORT: ${{ vars.MCP_PORT || secrets.MCP_PORT || '' }}
      MCP_BIND_ADDRESS: ${{ vars.MCP_BIND_ADDRESS || secrets.MCP_BIND_ADDRESS || '' }}
      MCP_ALLOWED_HOSTS: ${{ vars.MCP_ALLOWED_HOSTS || secrets.MCP_ALLOWED_HOSTS || '' }}
      MCP_ALLOWED_ORIGINS: ${{ vars.MCP_ALLOWED_ORIGINS || secrets.MCP_ALLOWED_ORIGINS || '' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || '' }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || secrets.BETTER_AUTH_URL || '' }}
      CLIENT_URL: ${{ vars.CLIENT_URL || secrets.CLIENT_URL || '' }}
      AUTH_GITHUB_ID: ${{ vars.AUTH_GITHUB_ID || secrets.AUTH_GITHUB_ID || '' }}
      AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET || '' }}
      AUTH_GOOGLE_ID: ${{ vars.AUTH_GOOGLE_ID || secrets.AUTH_GOOGLE_ID || vars.AUTH_GOOLE_ID || secrets.AUTH_GOOLE_ID || '' }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET || secrets.AUTH_GOOLE_SECRET || '' }}
      AUTH_GOOLE_ID: ${{ vars.AUTH_GOOLE_ID || secrets.AUTH_GOOLE_ID || '' }}
      AUTH_GOOLE_SECRET: ${{ secrets.AUTH_GOOLE_SECRET || '' }}
      EMAIL_USER: ${{ secrets.EMAIL_USER || '' }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS || '' }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM || '' }}
      EMAIL_SERVICE: ${{ vars.EMAIL_SERVICE || secrets.EMAIL_SERVICE || '' }}
      AI_CONFIG_SECRET: ${{ secrets.AI_CONFIG_SECRET || '' }}
      GH_IMAGE_REPO: ${{ vars.GH_IMAGE_REPO || secrets.GH_IMAGE_REPO || '' }}
      GH_IMAGE_TOKEN: ${{ secrets.GH_IMAGE_TOKEN || '' }}
      GH_IMAGE_BRANCH: ${{ vars.GH_IMAGE_BRANCH || secrets.GH_IMAGE_BRANCH || 'main' }}
      WEB_SEARCH_PROVIDER: ${{ vars.WEB_SEARCH_PROVIDER || secrets.WEB_SEARCH_PROVIDER || '' }}
      WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY || '' }}
      WEB_SEARCH_BASE_URL: ${{ vars.WEB_SEARCH_BASE_URL || secrets.WEB_SEARCH_BASE_URL || '' }}
      SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST || '' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT || '' }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE || secrets.SMTP_SECURE || '' }}
      DEPLOY_SYNC: ${{ needs.changes.outputs.client == 'true' && '0' || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Deploy server
        run: bash .github/scripts/deploy-service.sh

  deploy-mcp:
    name: Deploy MCP
    runs-on: ubuntu-latest
    needs:
      - changes
      - verify-client
      - verify-server
      - verify-mcp
      - deploy-client
      - deploy-server
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.changes.outputs.mcp == 'true' &&
      needs.verify-mcp.result == 'success' &&
      (needs.verify-client.result == 'success' || needs.verify-client.result == 'skipped') &&
      (needs.verify-server.result == 'success' || needs.verify-server.result == 'skipped') &&
      (needs.deploy-client.result == 'success' || needs.deploy-client.result == 'skipped') &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped')
    environment: production
    env:
      DEPLOY_SERVICE: mcp
      DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD || '' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || '' }}
      VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || '' }}
      VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || secrets.VITE_AUTH_URL || '' }}
      VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || secrets.VITE_SOCKET_URL || '' }}
      WEB_PORT: ${{ vars.WEB_PORT || secrets.WEB_PORT || '' }}
      MONGO_URI: ${{ secrets.MONGO_URI || '' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || '' }}
      SOCKET_PORT: ${{ vars.SOCKET_PORT || secrets.SOCKET_PORT || '' }}
      MCP_PORT: ${{ vars.MCP_PORT || secrets.MCP_PORT || '' }}
      MCP_BIND_ADDRESS: ${{ vars.MCP_BIND_ADDRESS || secrets.MCP_BIND_ADDRESS || '' }}
      MCP_ALLOWED_HOSTS: ${{ vars.MCP_ALLOWED_HOSTS || secrets.MCP_ALLOWED_HOSTS || '' }}
      MCP_ALLOWED_ORIGINS: ${{ vars.MCP_ALLOWED_ORIGINS || secrets.MCP_ALLOWED_ORIGINS || '' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || '' }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || secrets.BETTER_AUTH_URL || '' }}
      CLIENT_URL: ${{ vars.CLIENT_URL || secrets.CLIENT_URL || '' }}
      AUTH_GITHUB_ID: ${{ vars.AUTH_GITHUB_ID || secrets.AUTH_GITHUB_ID || '' }}
      AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET || '' }}
      AUTH_GOOGLE_ID: ${{ vars.AUTH_GOOGLE_ID || secrets.AUTH_GOOGLE_ID || vars.AUTH_GOOLE_ID || secrets.AUTH_GOOLE_ID || '' }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET || secrets.AUTH_GOOLE_SECRET || '' }}
      AUTH_GOOLE_ID: ${{ vars.AUTH_GOOLE_ID || secrets.AUTH_GOOLE_ID || '' }}
      AUTH_GOOLE_SECRET: ${{ secrets.AUTH_GOOLE_SECRET || '' }}
      EMAIL_USER: ${{ secrets.EMAIL_USER || '' }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS || '' }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM || '' }}
      EMAIL_SERVICE: ${{ vars.EMAIL_SERVICE || secrets.EMAIL_SERVICE || '' }}
      AI_CONFIG_SECRET: ${{ secrets.AI_CONFIG_SECRET || '' }}
      GH_IMAGE_REPO: ${{ vars.GH_IMAGE_REPO || secrets.GH_IMAGE_REPO || '' }}
      GH_IMAGE_TOKEN: ${{ secrets.GH_IMAGE_TOKEN || '' }}
      GH_IMAGE_BRANCH: ${{ vars.GH_IMAGE_BRANCH || secrets.GH_IMAGE_BRANCH || 'main' }}
      WEB_SEARCH_PROVIDER: ${{ vars.WEB_SEARCH_PROVIDER || secrets.WEB_SEARCH_PROVIDER || '' }}
      WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY || '' }}
      WEB_SEARCH_BASE_URL: ${{ vars.WEB_SEARCH_BASE_URL || secrets.WEB_SEARCH_BASE_URL || '' }}
      SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST || '' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT || '' }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE || secrets.SMTP_SECURE || '' }}
      DEPLOY_SYNC: ${{ (needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true') && '0' || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Deploy MCP
        run: bash .github/scripts/deploy-service.sh
