<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Dark File Manager · 文件管理</title>
  <style>
    :root {
      --page:#101216; --surface:#171a20; --surface-2:#1c2027; --hover:#20252d;
      --line:#2b3039; --line-strong:#383f4b; --text:#f2f4f7; --muted:#a2a9b4;
      --subtle:#737b87; --primary:#4f8cff; --primary-hover:#6ca0ff; --selected:#1c2c49;
    }
    * { box-sizing:border-box; }
    html,body { min-width:320px; min-height:100%; margin:0; }
    body {
      min-height:100vh; padding:34px; color:var(--text); background:var(--page);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }
    button,input { color:inherit; font:inherit; }
    button,a,input { -webkit-tap-highlight-color:transparent; }
    button:focus-visible,a:focus-visible,input:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
    .page { width:min(1240px,100%); margin:0 auto; }
    .page-header {
      display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
      margin-bottom:22px;
    }
    h1 { margin:0; font-size:30px; line-height:1.2; letter-spacing:-.03em; }
    .heading p { margin:7px 0 0; color:var(--muted); font-size:13px; }
    .tools { display:flex; align-items:center; gap:8px; }
    .search { position:relative; width:260px; }
    .search input {
      width:100%; height:38px; padding:0 13px; border:1px solid var(--line);
      border-radius:8px; outline:0; background:var(--surface); font-size:13px;
    }
    .search input::placeholder { color:var(--subtle); }
    .search input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,140,255,.13); }
    .button {
      height:38px; padding:0 15px; border:1px solid var(--line-strong); border-radius:8px;
      background:var(--surface); font-size:13px; font-weight:600; cursor:pointer;
    }
    .button:hover { background:var(--hover); }
    .button.primary { border-color:var(--primary); background:var(--primary); color:white; }
    .button.primary:hover { border-color:var(--primary-hover); background:var(--primary-hover); }
    .manager {
      display:grid; grid-template-columns:210px minmax(0,1fr); min-height:610px;
      overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--surface);
      box-shadow:0 16px 46px rgba(0,0,0,.18);
    }
    .sidebar { padding:18px 12px; border-right:1px solid var(--line); background:#14171c; }
    .sidebar h2 { margin:0 8px 12px; color:var(--subtle); font-size:11px; font-weight:600; letter-spacing:.08em; }
    .folders { display:grid; gap:3px; }
    .folders a {
      display:flex; min-height:38px; align-items:center; gap:10px; padding:0 10px;
      border-radius:7px; color:var(--muted); font-size:13px; text-decoration:none;
    }
    .folders a:hover { color:var(--text); background:var(--hover); }
    .folders a.active { color:var(--text); background:var(--selected); box-shadow:inset 2px 0 var(--primary); }
    .folders span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .folders small { color:var(--subtle); font-size:11px; }
    .content { min-width:0; padding:0 20px 20px; }
    .breadcrumbs {
      display:flex; height:56px; align-items:center; gap:8px; border-bottom:1px solid var(--line);
      color:var(--subtle); font-size:12px;
    }
    .breadcrumbs strong { color:var(--text); font-weight:600; }
    .breadcrumbs i { color:#4d5561; font-style:normal; }
    .breadcrumbs .count { margin-left:auto; color:var(--muted); }
    .file-list { margin-top:16px; overflow:hidden; border:1px solid var(--line); border-radius:10px; }
    .list-head,.file-row {
      display:grid; grid-template-columns:42px minmax(220px,1fr) 140px 150px 70px;
      align-items:center; column-gap:12px; padding:0 14px;
    }
    .list-head {
      min-height:40px; border-bottom:1px solid var(--line); background:var(--surface-2);
      color:var(--subtle); font-size:11px; font-weight:600;
    }
    .file-row { min-height:58px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
    .file-row:last-child { border-bottom:0; }
    .file-row:hover { background:var(--hover); }
    .file-row:focus-within { background:var(--selected); }
    .check { display:grid; place-items:start; }
    input[type="checkbox"] { width:15px; height:15px; margin:0; accent-color:var(--primary); }
    .name { min-width:0; overflow:hidden; color:var(--text); font-size:13px; font-weight:550; text-overflow:ellipsis; white-space:nowrap; }
    .folder-name { font-weight:650; }
    .details { display:grid; gap:3px; }
    .details strong { color:var(--muted); font-size:11px; font-weight:500; }
    .details small { color:var(--subtle); font-size:10px; }
    .modified { color:var(--muted); }
    .more {
      justify-self:end; min-width:48px; height:30px; padding:0 9px; border:1px solid transparent;
      border-radius:6px; color:var(--muted); background:transparent; font-size:11px; cursor:pointer;
    }
    .more:hover { border-color:var(--line-strong); color:var(--text); background:var(--surface-2); }
    .mobile-meta { display:none; }
    .list-footer { padding:12px 14px; border-top:1px solid var(--line); color:var(--subtle); font-size:11px; }
    @media (max-width:820px) {
      body { padding:22px; }
      .page-header { align-items:stretch; flex-direction:column; }
      .tools,.search { width:100%; }
      .search { flex:1; }
      .manager { grid-template-columns:1fr; }
      .sidebar { padding:10px 12px; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); }
      .sidebar h2 { display:none; }
      .folders { display:flex; width:max-content; }
      .folders a { min-width:max-content; padding:0 13px; }
      .folders a.active { box-shadow:inset 0 -2px var(--primary); }
    }
    @media (max-width:600px) {
      body { padding:16px; }
      h1 { font-size:26px; }
      .tools { display:grid; grid-template-columns:1fr 1fr; }
      .search { grid-column:1/-1; }
      .button { width:100%; }
      .manager { min-height:0; border-radius:12px; }
      .content { padding:0 10px 12px; }
      .breadcrumbs { height:48px; }
      .list-head,.file-row { grid-template-columns:32px minmax(0,1fr) 58px; column-gap:8px; padding:0 10px; }
      .list-head .type,.list-head .modified,.file-row .details,.file-row .modified { display:none; }
      .mobile-meta { display:block; margin-top:4px; color:var(--subtle); font-size:10px; font-weight:400; }
      .name { white-space:normal; }
      .file-row { min-height:64px; }
      .more { min-width:48px; padding:0 7px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="heading"><h1>文件管理</h1><p>整理并查找团队共享文件</p></div>
      <div class="tools"><label class="search"><input type="search" placeholder="搜索文件和文件夹" aria-label="搜索文件和文件夹" /></label><button class="button" type="button">新建</button><button class="button primary" type="button">上传</button></div>
    </header>
    <section class="manager">
      <aside class="sidebar"><h2>目录</h2><nav class="folders" aria-label="文件目录"><a class="active" href="#"><span>全部文件</span><small>6</small></a><a href="#"><span>产品资料</span></a><a href="#"><span>设计素材</span></a><a href="#"><span>会议归档</span></a></nav></aside>
      <div class="content">
        <nav class="breadcrumbs" aria-label="当前位置"><span>文件</span><i>/</i><strong>全部文件</strong><span class="count">6 项</span></nav>
        <section class="file-list" aria-label="文件列表">
          <div class="list-head"><label class="check"><input type="checkbox" aria-label="选择全部" /></label><span>名称</span><span class="type">类型 / 大小</span><span class="modified">修改时间</span><span></span></div>
          <div class="file-row"><label class="check"><input type="checkbox" aria-label="选择产品资料" /></label><div class="name folder-name">产品资料<span class="mobile-meta">文件夹</span></div><div class="details"><strong>文件夹</strong><small>—</small></div><span class="modified">今天 13:42</span><button class="more" type="button">更多</button></div>
          <div class="file-row"><label class="check"><input type="checkbox" aria-label="选择设计素材" /></label><div class="name folder-name">设计素材<span class="mobile-meta">文件夹</span></div><div class="details"><strong>文件夹</strong><small>—</small></div><span class="modified">今天 11:08</span><button class="more" type="button">更多</button></div>
          <div class="file-row"><label class="check"><input type="checkbox" aria-label="选择会议归档" /></label><div class="name folder-name">会议归档<span class="mobile-meta">文件夹</span></div><div class="details"><strong>文件夹</strong><small>—</small></div><span class="modified">昨天 18:20</span><button class="more" type="button">更多</button></div>
          <div class="file-row"><label class="check"><input type="checkbox" aria-label="选择 Nubbi 产品手册" /></label><div class="name">Nubbi 产品手册.pdf<span class="mobile-meta">PDF · 2.4 MB</span></div><div class="details"><strong>PDF</strong><small>2.4 MB</small></div><span class="modified">今天 09:18</span><button class="more" type="button">更多</button></div>
          <div class="file-row"><label class="check"><input type="checkbox" aria-label="选择发布说明" /></label><div class="name">发布说明.md<span class="mobile-meta">Markdown · 18 KB</span></div><div class="details"><strong>Markdown</strong><small>18 KB</small></div><span class="modified">昨天 16:36</span><button class="more" type="button">更多</button></div>
          <div class="file-row"><label class="check"><input type="checkbox" aria-label="选择演示封面" /></label><div class="name">演示封面.png<span class="mobile-meta">PNG · 4.8 MB</span></div><div class="details"><strong>PNG</strong><small>4.8 MB</small></div><span class="modified">7月13日 21:05</span><button class="more" type="button">更多</button></div>
          <footer class="list-footer">6 个项目 · 3 个文件夹 · 3 个文件</footer>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
