<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文件管理 · Grid Explorer</title>
  <style>
    :root{--canvas:#f5f7fb;--paper:#fff;--ink:#172033;--muted:#778096;--line:#dfe4ef;--soft:#f7f9fc;--blue:#3267e3;--blue-soft:#edf3ff;--hover:#f1f5fb;--danger:#cf3c4f}
    *{box-sizing:border-box}html,body{min-width:320px;min-height:100%;margin:0}body{background:var(--canvas);color:var(--ink);font-family:Inter,Arial,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer}
    .manager{width:min(1180px,calc(100% - 40px));min-height:680px;margin:24px auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
    header{display:flex;min-height:64px;align-items:center;justify-content:space-between;gap:20px;padding:0 22px}.title{display:flex;align-items:baseline;gap:9px}.title h1{margin:0;font-size:19px}.title span{color:var(--muted);font-size:11px}.actions{display:flex;gap:7px}.button{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-size:12px}.button:hover{background:var(--hover)}.button.primary{border-color:var(--blue);background:var(--blue);color:var(--paper)}
    .toolbar{display:flex;min-height:50px;align-items:center;justify-content:space-between;gap:16px;padding:7px 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}.path{color:var(--muted);font-size:12px}.path strong{color:var(--ink)}.tools{display:flex;align-items:center;gap:6px}.search{width:220px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);outline:0}.search:focus{border-color:var(--blue)}.tool{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--muted);font-size:12px}
    .content{padding:20px 22px 28px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px;color:var(--muted);font-size:11px}.section-title strong{color:var(--ink);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:24px}.card{position:relative;min-height:118px;padding:15px;border:1px solid var(--line);border-radius:8px;background:var(--paper);transition:.15s ease}.card:hover{border-color:var(--blue);background:var(--blue-soft)}
    .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.card input{width:14px;height:14px;accent-color:var(--blue)}.more{width:26px;height:26px;border:0;border-radius:4px;background:transparent;color:var(--muted)}.more:hover{background:var(--paper)}.name{margin:17px 0 9px;overflow:hidden;font-size:14px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px}.type{padding:3px 6px;border-radius:4px;background:var(--soft);color:var(--muted)}.folder .type{background:var(--blue-soft);color:var(--blue)}
    .selection{display:none;margin:0 22px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--blue-soft);color:var(--blue);font-size:12px}.selection button{margin-left:8px;border:0;background:transparent;color:inherit}.selection .danger{color:var(--danger)}
    @media(max-width:760px){.manager{width:calc(100% - 24px);min-height:calc(100vh - 24px);margin:12px auto}header{align-items:flex-start;flex-direction:column;padding:16px}.toolbar{align-items:flex-start;flex-direction:column;padding:12px 16px}.tools{width:100%}.search{min-width:0;flex:1}.content{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:460px){.actions{width:100%}.button{flex:1}.grid{grid-template-columns:1fr}.tool:nth-last-child(2){display:none}}
  </style>
</head>
<body>
  <main class="manager">
    <header><div class="title"><h1>文件</h1><span>6 项</span></div><div class="actions"><button class="button">传输 2</button><button class="button">新建文件夹</button><button class="button primary">上传</button></div></header>
    <div class="toolbar"><div class="path"><strong>全部文件</strong> / 当前目录</div><div class="tools"><input class="search" type="search" placeholder="搜索当前目录" aria-label="搜索文件" /><button class="tool">最近修改</button><button class="tool">列表视图</button><button class="tool">刷新</button></div></div>
    <div class="selection">已选择 2 项 <button>移动</button><button class="danger">删除</button><button>取消</button></div>
    <section class="content">
      <div class="section-title"><strong>文件夹</strong><span>3 个</span></div>
      <div class="grid">
        <article class="card folder"><div class="card-top"><input type="checkbox" aria-label="选择产品资料" /><button class="more">•••</button></div><div class="name">产品资料</div><div class="meta"><span class="type">文件夹</span><span>12 项 · 今天</span></div></article>
        <article class="card folder"><div class="card-top"><input type="checkbox" aria-label="选择设计素材" /><button class="more">•••</button></div><div class="name">设计素材</div><div class="meta"><span class="type">文件夹</span><span>8 项 · 昨天</span></div></article>
        <article class="card folder"><div class="card-top"><input type="checkbox" aria-label="选择会议归档" /><button class="more">•••</button></div><div class="name">会议归档</div><div class="meta"><span class="type">文件夹</span><span>24 项 · 07/13</span></div></article>
      </div>
      <div class="section-title"><strong>文件</strong><span>3 个</span></div>
      <div class="grid">
        <article class="card"><div class="card-top"><input type="checkbox" aria-label="选择产品手册" /><button class="more">•••</button></div><div class="name">Nubbi 产品手册.pdf</div><div class="meta"><span class="type">PDF · 2.4 MB</span><span>今天 09:18</span></div></article>
        <article class="card"><div class="card-top"><input type="checkbox" aria-label="选择发布说明" /><button class="more">•••</button></div><div class="name">发布说明.md</div><div class="meta"><span class="type">MD · 53 KB</span><span>今天 10:32</span></div></article>
        <article class="card"><div class="card-top"><input type="checkbox" aria-label="选择演示封面" /><button class="more">•••</button></div><div class="name">演示封面.png</div><div class="meta"><span class="type">PNG · 3.6 MB</span><span>昨天 16:20</span></div></article>
      </div>
    </section>
  </main>
</body>
</html>
