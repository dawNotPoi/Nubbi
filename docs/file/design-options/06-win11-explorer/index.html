<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文件 · Win11 Explorer</title>
  <style>
    :root{--canvas:#e6edf6;--window:#f8fafc;--chrome:#f0f5fa;--surface:#fff;--text:#1f2328;--muted:#66707c;--line:#dfe4ea;--hover:#f2f6fa;--selected:#e5f1fb;--blue:#0067c0;--focus:#b9daf4}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:13px/1.4 "Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}button{cursor:pointer}
    .canvas{min-height:100vh;padding:34px;display:grid;place-items:center;background:linear-gradient(145deg,#edf3fa,#dce7f3)}
    .window{width:min(1260px,100%);height:min(780px,calc(100vh - 68px));min-height:620px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #cfd6de;border-radius:14px;background:var(--window);box-shadow:0 22px 60px rgba(47,68,92,.22)}
    .titlebar{height:46px;display:flex;align-items:end;background:var(--chrome);user-select:none}.tabs{height:100%;display:flex;align-items:end;padding-left:10px;gap:5px}.tab{min-width:210px;height:36px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-radius:8px 8px 0 0;background:var(--surface)}.new-tab{width:34px;height:34px;border:0;background:transparent;border-radius:6px;font-size:18px}.new-tab:hover{background:#e1e9f1}.window-actions{margin-left:auto;height:100%;display:flex}.window-actions button{width:46px;border:0;background:transparent}.window-actions button:hover{background:#dfe8f0}.window-actions .close:hover{background:#c42b1c;color:#fff}
    .location{min-height:56px;padding:9px 12px;display:grid;grid-template-columns:auto minmax(260px,1fr) 260px;gap:8px;align-items:center;background:var(--surface);border-bottom:1px solid var(--line)}
    .nav-controls{display:flex;gap:3px}.icon-button{width:34px;height:34px;border:0;border-radius:5px;background:transparent;font-size:16px}.icon-button:hover{background:var(--hover)}
    .address,.search{height:36px;border:1px solid var(--line);border-radius:6px;background:#fbfdff;outline:none}.address{display:flex;align-items:center;gap:8px;padding:0 12px}.address button{padding:0;border:0;background:transparent}.address .sep{color:#9ca4ad}.search{width:100%;padding:0 12px}.search:focus{border-color:var(--blue);box-shadow:inset 0 -2px var(--blue)}
    .commands{height:50px;padding:7px 14px;display:flex;align-items:center;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}.command{height:34px;padding:0 12px;border:0;border-radius:5px;background:transparent;white-space:nowrap}.command:hover{background:var(--hover)}.command.primary{background:var(--blue);color:#fff}.command.primary:hover{background:#005a9e}.divider{width:1px;height:22px;margin:0 5px;background:var(--line)}
    .workspace{min-height:0;flex:1;display:grid;grid-template-columns:210px minmax(0,1fr)}.sidebar{padding:12px 8px;background:var(--chrome);border-right:1px solid var(--line);overflow:auto}.side-title{padding:6px 11px;color:var(--muted);font-size:12px}.side-link{width:100%;height:36px;padding:0 11px;border:0;border-radius:5px;background:transparent;text-align:left}.side-link:hover{background:#e7edf3}.side-link.active{background:var(--selected);color:#004f91;font-weight:600}.side-gap{height:10px}
    .content{min-width:0;background:var(--surface);overflow:auto}.table{width:100%;border-collapse:collapse;table-layout:fixed}.table th{position:sticky;top:0;z-index:1;height:36px;padding:0 10px;background:#fafcfe;border-bottom:1px solid var(--line);color:var(--muted);text-align:left;font-weight:400}.table th+th{border-left:1px solid #edf0f3}.table td{height:42px;padding:0 10px;border-bottom:1px solid #f0f2f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table tbody tr:hover{background:var(--hover)}.table tbody tr.selected{background:var(--selected)}.check{width:42px!important;text-align:center!important}.name{font-weight:500}.type{width:150px;color:var(--muted)}.size{width:110px;color:var(--muted)}.modified{width:170px;color:var(--muted)}.actions{width:76px;text-align:right!important}.more{padding:4px 7px;border:0;border-radius:4px;background:transparent;color:var(--muted);opacity:0}.table tr:hover .more,.more:focus{opacity:1}.more:hover{background:#dfe8f1;color:var(--text)}input[type=checkbox]{width:15px;height:15px;margin:0;accent-color:var(--blue)}
    .status{height:30px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);background:var(--chrome);color:var(--muted);font-size:12px}.empty{display:none;padding:80px 20px;text-align:center;color:var(--muted)}.draft-input{width:min(340px,100%);height:29px;padding:0 8px;border:1px solid var(--blue);border-radius:4px;outline:2px solid var(--focus)}
    @media(max-width:850px){.canvas{padding:0}.window{height:100vh;min-height:600px;border:0;border-radius:0}.location{grid-template-columns:auto minmax(0,1fr)}.location .search{grid-column:1/-1}.workspace{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.sidebar{display:flex;gap:4px;padding:7px 8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.side-title,.side-gap{display:none}.side-link{width:auto;min-width:max-content}.size{display:none}}
    @media(max-width:560px){.tab{min-width:150px}.window-actions button{width:38px}.commands{padding-inline:8px}.type{display:none}.modified{width:110px}.check{width:34px!important}.table th,.table td{padding-inline:6px}.actions{width:62px}.more{opacity:1}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="canvas"><section class="window" aria-label="文件资源管理器">
    <header class="titlebar"><div class="tabs"><div class="tab"><span>文件</span><span>×</span></div><button class="new-tab" type="button" aria-label="新建标签页">＋</button></div><div class="window-actions"><button type="button" aria-label="最小化">—</button><button type="button" aria-label="最大化">□</button><button class="close" type="button" aria-label="关闭">×</button></div></header>
    <div class="location"><div class="nav-controls"><button class="icon-button" type="button" aria-label="后退">←</button><button class="icon-button" type="button" aria-label="前进">→</button><button class="icon-button" type="button" aria-label="上一级">↑</button></div><div class="address"><button type="button">文件</button><span class="sep">›</span><button type="button">项目空间</button></div><input class="search" id="search" type="search" placeholder="搜索 项目空间" aria-label="搜索项目空间"></div>
    <nav class="commands" aria-label="文件操作"><button class="command primary" id="new" type="button">＋ 新建</button><button class="command" id="upload" type="button">↑ 上传</button><span class="divider"></span><button class="command" id="selectAll" type="button">选择全部</button><button class="command" id="sort" type="button">排序：名称</button><span class="divider"></span><button class="command" type="button">更多</button><input id="picker" type="file" hidden multiple></nav>
    <div class="workspace">
      <aside class="sidebar" aria-label="快速访问"><div class="side-title">快速访问</div><button class="side-link active" type="button">项目空间</button><button class="side-link" type="button">最近使用</button><button class="side-link" type="button">与我共享</button><button class="side-link" type="button">已加星标</button><div class="side-gap"></div><div class="side-title">位置</div><button class="side-link" type="button">全部文件</button><button class="side-link" type="button">传输任务</button><button class="side-link" type="button">回收站</button></aside>
      <section class="content"><table class="table"><thead><tr><th class="check"><input id="master" type="checkbox" aria-label="全选"></th><th>名称</th><th class="type">类型</th><th class="size">大小</th><th class="modified">修改日期</th><th class="actions">操作</th></tr></thead><tbody id="rows">
        <tr data-name="产品资料" data-sort="1"><td class="check"><input type="checkbox" aria-label="选择产品资料"></td><td class="name">产品资料</td><td class="type">文件夹</td><td class="size">—</td><td class="modified">今天 09:40</td><td class="actions"><button class="more" type="button">•••</button></td></tr>
        <tr data-name="设计素材" data-sort="2"><td class="check"><input type="checkbox" aria-label="选择设计素材"></td><td class="name">设计素材</td><td class="type">文件夹</td><td class="size">—</td><td class="modified">昨天 16:24</td><td class="actions"><button class="more" type="button">•••</button></td></tr>
        <tr data-name="会议归档" data-sort="3"><td class="check"><input type="checkbox" aria-label="选择会议归档"></td><td class="name">会议归档</td><td class="type">文件夹</td><td class="size">—</td><td class="modified">7 月 12 日</td><td class="actions"><button class="more" type="button">•••</button></td></tr>
        <tr data-name="Nubbi 产品手册.pdf" data-sort="4"><td class="check"><input type="checkbox" aria-label="选择产品手册"></td><td class="name">Nubbi 产品手册.pdf</td><td class="type">PDF 文档</td><td class="size">2.4 MB</td><td class="modified">7 月 11 日</td><td class="actions"><button class="more" type="button">•••</button></td></tr>
        <tr data-name="发布说明.md" data-sort="5"><td class="check"><input type="checkbox" aria-label="选择发布说明"></td><td class="name">发布说明.md</td><td class="type">Markdown</td><td class="size">18 KB</td><td class="modified">7 月 9 日</td><td class="actions"><button class="more" type="button">•••</button></td></tr>
        <tr data-name="演示封面.png" data-sort="6"><td class="check"><input type="checkbox" aria-label="选择演示封面"></td><td class="name">演示封面.png</td><td class="type">PNG 图像</td><td class="size">1.8 MB</td><td class="modified">7 月 6 日</td><td class="actions"><button class="more" type="button">•••</button></td></tr>
      </tbody></table><div class="empty" id="empty">未找到匹配的文件</div></section>
    </div><footer class="status"><span id="status">6 个项目</span><span>详细信息视图</span></footer>
  </section></main>
  <script>
    const rows=document.querySelector('#rows'),search=document.querySelector('#search'),status=document.querySelector('#status'),empty=document.querySelector('#empty'),master=document.querySelector('#master');let descending=false;
    const entries=()=>[...rows.querySelectorAll('tr:not(.draft)')];
    search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();let n=0;entries().forEach(row=>{const show=row.dataset.name.toLowerCase().includes(q);row.hidden=!show;n+=show});status.textContent=`${n} 个项目`;empty.style.display=n?'none':'block'});
    master.addEventListener('change',()=>entries().filter(row=>!row.hidden).forEach(row=>{row.querySelector('input').checked=master.checked;row.classList.toggle('selected',master.checked)}));
    rows.addEventListener('change',event=>{const row=event.target.closest('tr');if(row)row.classList.toggle('selected',event.target.checked)});
    document.querySelector('#selectAll').addEventListener('click',()=>{master.checked=true;master.dispatchEvent(new Event('change'))});document.querySelector('#upload').addEventListener('click',()=>document.querySelector('#picker').click());
    document.querySelector('#sort').addEventListener('click',event=>{descending=!descending;entries().sort((a,b)=>(descending?-1:1)*a.dataset.name.localeCompare(b.dataset.name,'zh-CN')).forEach(row=>rows.append(row));event.currentTarget.textContent=`排序：名称 ${descending?'降序':'升序'}`});
    document.querySelector('#new').addEventListener('click',()=>{if(document.querySelector('.draft'))return;const row=document.createElement('tr');row.className='draft';row.innerHTML='<td class="check"><input type="checkbox" disabled></td><td><input class="draft-input" placeholder="新文件夹" aria-label="新文件夹名称"></td><td class="type">文件夹</td><td class="size">—</td><td class="modified">刚刚</td><td></td>';rows.prepend(row);const input=row.querySelector('input.draft-input');input.focus();input.addEventListener('keydown',e=>{if(e.key==='Escape')row.remove();if(e.key==='Enter'&&input.value.trim()){row.dataset.name=input.value.trim();row.className='';row.innerHTML='<td class="check"><input type="checkbox"></td><td class="name"></td><td class="type">文件夹</td><td class="size">—</td><td class="modified">刚刚</td><td class="actions"><button class="more">•••</button></td>';row.querySelector('.name').textContent=input.value.trim();status.textContent=`${entries().length} 个项目`}})});
  </script>
</body>
</html>
