services:
  client:
    image: nginx:1.27-alpine
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    ports:
      - "${WEB_PORT:-80}:80/tcp"
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env
      - path: ./turn/.env
        required: false
    ports:
      - "${SERVER_PORT:-4000}:4000/tcp"
      - "${SOCKET_PORT:-4040}:4040/tcp"
    expose:
      - "4000"
      - "4040"
    volumes:
      - server_storage:/app/server/storage
    restart: unless-stopped

  turn:
    build:
      context: ./turn
      dockerfile: Dockerfile
    profiles: [meeting]
    env_file:
      - path: ./turn/.env
        required: false
    volumes:
      - ./turn/certs:/run/turn-certs:ro
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
      - /var/lib/coturn:uid=65534,gid=65534,mode=0700,size=4m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "turnutils_stunclient -p 3478 127.0.0.1 2>&1 | grep -q 'UDP reflexive addr'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    environment:
      # 留空表示不校验 Host 头（默认公开）；需要白名单时在根 .env 设置 MCP_ALLOWED_HOSTS。
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3100
      MCP_TRANSPORT: http
      NUBBI_API_URL: http://server:4000
    ports:
      # 默认 0.0.0.0 便于开发测试直接远程访问；生产环境建议在根 .env 设置 MCP_BIND_ADDRESS=127.0.0.1。
      - "${MCP_BIND_ADDRESS:-0.0.0.0}:${MCP_PORT:-3100}:3100/tcp"
    expose:
      - "3100"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_storage:
