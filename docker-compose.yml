services:
  client:
    image: nginx:1.27-alpine
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    ports:
      - "${WEB_PORT:-80}:80/tcp"
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env
    ports:
      - "${SERVER_PORT:-4000}:4000/tcp"
      - "${SOCKET_PORT:-4040}:4040/tcp"
    expose:
      - "4000"
      - "4040"
    volumes:
      - server_storage:/app/server/storage
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    environment:
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3100
      MCP_TRANSPORT: http
      NUBBI_API_URL: http://server:4000
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-3100}:3100/tcp"
    expose:
      - "3100"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_storage:
